name: Analyze Next Repo

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      OG_MONGODB_URI: ${{ secrets.OG_MONGODB_URI }}
      GH_PAT: ${{ secrets.GH_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_USER: rishabh3562
      ANALYSIS_MODEL: nvidia/nemotron-3-ultra-550b:free
      EMBEDDING_MODEL: text-embedding-3-small
    steps:
      - uses: actions/checkout@v4
      
      - name: Show directory structure
        run: |
          pwd
          ls -la
          echo "=== SRC ==="
          ls -la src/ || echo "src not found"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --verbose
      
      - name: Install package
        run: |
          pip install -e . --verbose 2>&1 | tee install.log
          echo "INSTALL_EXIT_CODE: ${PIPESTATUS[0]}"
        env:
          PIP_VERBOSE: 1
      
      - name: Check install log
        if: failure()
        run: cat install.log
      
      - name: Verify import
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import llm_wiki; print('OK:', llm_wiki.__version__)"
          python -c "import sys; sys.path.insert(0, 'src'); from llm_wiki.config import config; print('Config:', config.github_user)"
        env:
          PYTHONPATH: src
      
      - name: Run repo analysis
        run: |
          python -m llm_wiki.analyze
        env:
          PYTHONPATH: src
      
      - name: Commit vault updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add obsidian-vault/
            git commit -m "chore: update vault from repo analysis"
            git push
          else
            echo "No vault changes"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      
      - name: Log result
        if: always()
        run: echo "Done"
