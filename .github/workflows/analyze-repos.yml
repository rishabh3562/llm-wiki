name: Analyze Next Repo

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      OG_MONGODB_URI: ${{ secrets.OG_MONGODB_URI }}
      GH_PAT: ${{ secrets.GH_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_USER: rishabh3562
      ANALYSIS_MODEL: nvidia/nemotron-3-ultra-550b:free
      EMBEDDING_MODEL: text-embedding-3-small
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          set -x
          pip install --upgrade pip
          pip install -r requirements.txt --verbose
          pip install -e . --verbose
        env:
          PIP_VERBOSE: 1
      
      - name: Debug package structure
        run: |
          echo "=== Package structure ==="
          find src -name "*.py" | head -20
          python -c "import sys; sys.path.insert(0, 'src'); import llm_wiki; print('Import OK:', llm_wiki.__version__)"
      
      - name: Run repo analysis
        run: |
          python -m llm_wiki.analyze
      
      - name: Commit vault updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add obsidian-vault/
            git commit -m "chore: update vault from repo analysis"
            git push
          else
            echo "No vault changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      
      - name: Log result
        if: always()
        run: |
          echo "Analysis completed with status: ${{ job.status }}"